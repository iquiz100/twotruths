<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="mark">Two Truths</div>
    </header>

    <div id="loading-panel" class="panel">
      <p style="margin:0; color:var(--text-muted);">Loading...</p>
    </div>

    <div id="error-panel" class="panel" style="display:none;">
      <p id="error-text" style="color:var(--accent-garnet); margin:0;"></p>
    </div>

    <div id="waiting-panel" class="panel status-panel" style="display:none;">
      <h1>Almost there</h1>
      <p class="lede" id="waiting-text"></p>
      <button id="refresh-btn" class="btn btn-secondary">Check again</button>
    </div>

    <div id="results-panel" style="display:none;">
      <h1>Your shared results</h1>
      <p class="lede" id="results-intro"></p>
      <div id="results-body"></div>
    </div>
  </div>

  <script type="module" src="js/results.js"></script>
</body>
</html>
